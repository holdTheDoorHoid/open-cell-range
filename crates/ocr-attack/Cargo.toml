[package]
name = "ocr-attack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Attacker actors (IMSI catch, downgrade, null-cipher, relay) for Open Cell Range"

[features]
default = ["std"]
std = []

[dependencies]
ocr-crypto = { workspace = true }
ocr-identity = { workspace = true }
ocr-gsm = { workspace = true }
ocr-lte = { workspace = true }
ocr-nr = { workspace = true }
ocr-air = { workspace = true }

[dev-dependencies]
# Only the tests need this — to assert the matching `ocr-detect` finding appears
# when a passive monitor observes the air an actor leaves behind (the attack↔
# detection pairing). The library itself drives the world only through `ocr-air`.
ocr-detect = { workspace = true }
