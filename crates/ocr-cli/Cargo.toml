[package]
name = "ocr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Load a capture and replay it through the Open Cell Range engines (phase-two seam)."

[[bin]]
name = "ocr"
path = "src/main.rs"

[dependencies]
ocr-crypto = { workspace = true }
ocr-identity = { workspace = true }
ocr-gsm = { workspace = true }
ocr-lte = { workspace = true }
ocr-nr = { workspace = true }
ocr-air = { workspace = true }
ocr-detect = { workspace = true }
ocr-scenario = { workspace = true }
# The capture reader/writer (native NDJSON + GSMTAP pcap) lives here; the CLI's
# `ndjson` module re-exports it, so `record`/`replay`/`import` share one format.
ocr-import = { workspace = true }
