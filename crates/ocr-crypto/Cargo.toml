[package]
name = "ocr-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic cryptographic primitives (MILENAGE, ECIES SUCI, seeded RNG) for Open Cell Range"

[features]
default = ["std"]
std = []

[dependencies]
aes = { workspace = true }
ctr = { workspace = true }
cmac = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
# The SUCI Profile A curve. `default-features = false` + `static_secrets` keeps it
# off OS entropy (no getrandom) so the crate still builds on wasm32-unknown-unknown.
x25519-dalek = { workspace = true }
