[package]
name = "ocr-lte"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "4G/LTE EPS-AKA, NAS/RRC message subset and security context for Open Cell Range"

[features]
default = ["std"]
std = []

[dependencies]
ocr-identity = { workspace = true }
ocr-crypto = { workspace = true }
# The TS 33.220 generic KDF used for K_ASME is HMAC-SHA-256. Both are
# `default-features = false` so the crate still builds on wasm32-unknown-unknown
# with no OS entropy or clock (ocr-crypto pulls the same two for SUCI).
sha2 = { workspace = true }
hmac = { workspace = true }
